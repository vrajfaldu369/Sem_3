<!-- WAP in JavaScript to print the factors of given number. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factors</title>
</head>
<body>
    <script>
        let n = parseInt(prompt("Enter number: "))

        document.write("Factors: ")
        for(i = 0; i < n; i++){
            if(n % i == 0){
                document.write(i+", ")
            }
        }
        document.write(n)
    </script>
</body>
</html>
