<!-- Find Maximum, Minimum, and Absolute Value using the Math object. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        document.write("maximum: "+Math.max(45,77,18)+"<br/>")
        document.write("minimum: "+Math.min(66,33,99)+"<br/>")
        document.write("absolute: "+Math.abs(-88)+"<br/>")
    </script>
</body>
</html>
