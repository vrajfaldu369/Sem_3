<!-- Generate a Random Password (digits only) of user-defined length using the Math 
object. -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let length = parseInt(prompt("Enter Password Length"));

        let password = "";

        for (let i = 1; i <= length; i++) {
            password = password + Math.floor(Math.random() * 10);
        }

        document.write("Password = " + password);
    </script>
</body>

</html>
