<!-- Calculate a person's Age from their Date of Birth. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let dob = parseInt(prompt("Enter Year of Year: "))

        let curruntYear = new Date().getFullYear()

        age = curruntYear - dob
        document.write("Age: "+age)

    </script>
</body>
</html>
