<!-- Display Floor, Ceiling, Round, and Truncate values of a decimal number. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        document.write("Floor: "+Math.floor(5.9)+"<br/>")
        document.write("Ceiling: "+Math.ceil(5.1)+"<br/>")
        document.write("Round: "+Math.round(8.6)+"<br/>")
        document.write("Truncate: "+Math.trunc(8.546546))

    </script>
</body>
</html>
