<!-- Display the Current Date, Time, Day, Month, and Year using the Date object. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let today = new Date();
        document.write("Current Date:  "+today.getDate()+"<br/>")
        document.write("Time: "+today.getTime()+"<br/>")
        document.write("Day: "+today.getDay()+"<br/>")
        document.write("Month: "+today.getMonth()+"<br/>")
        document.write("Year: "+today.getFullYear())
    </script>
</body>
</html>
