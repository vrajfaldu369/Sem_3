<!-- Generate a Random Password (alpha numberical) of user-defined length using the 
Math object. -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let size = parseInt(prompt("Enter Password Length"));

        let chars =
            "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

        let pass = "";

        for (let i = 1; i <= size; i++) {
            let index = Math.floor(Math.random() * chars.length);
            pass = pass + chars[index];
        }

        document.write("Password = " + pass);
    </script>
</body>

</html>
