<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>callback</title>
</head>
<body>
    <script>
        function printData(val){
            document.write(val)
        }
        function abc(a,b,callback){
            sum = a+b;
            callback(sum)
        }
        abc(1,2,printData)
    </script>
</body>
</html>
