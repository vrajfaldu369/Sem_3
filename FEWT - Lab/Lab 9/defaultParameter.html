<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nDefault Parameter</title>
</head>
<body>
    <script>
        function abc(a, b, c = 1){
            document.write("a: "+a+" b: "+b+" c: "+c+"<br/>")
        }
        abc(1,2,3)
        abc(1,2)
    </script>
</body>
</html>
