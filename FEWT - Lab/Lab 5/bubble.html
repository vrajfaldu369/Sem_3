<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!--WAP to read an array from the user and sort them in ascending order-->
    <script>
        n = parseInt(prompt("Enter size: "))
        let a = []
        for (i = 0; i < n; i++) {
            b = parseInt(prompt("Enter number: "))
            a.push(b)
        }

        for (i = 0; i < a.length - 1; i++) {
            for (j = 0; j < a.length - 1 - i; j++) {
                if (a[j] > a[j + 1]) {
                    swap = a[j]
                    a[j] = a[j + 1]
                    a[j + 1] = swap
                }
            }
        }

        document.write("array: " + a)
    </script>
</body>

</html>
