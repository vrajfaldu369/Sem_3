<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>max</title>
</head>

<body>
    <!--1. Demonstrate the use of array to ƒind maximum number.-->
    <script>
        n = parseInt(prompt("Enter size: "))
        let b = []
        for (i = 0; i < n; i++) {
            input = parseInt(prompt("Enter number: "))
            b.push(input);
        }
        document.write(b+"</br>")

        max = b[0]
        for (i = 1; i < b.length; i++) {
            if (b[i] > max) {
                max = b[i]
            }
        }

        document.write("max: "+max)
    </script>
</body>

</html>
