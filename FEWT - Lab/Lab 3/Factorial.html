<!-- WAP in JavaScript to ƒnd the factorial of given number. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factorial</title>
</head>
<body>
    <script>
        let n = parseInt(prompt("Enter number: "));
        res = 1
        for(let i = 1; i <= n; i++){
            res *= i;
        }
        alert("Factorial of "+n+" is "+res);
    </script>
</body>
</html>
