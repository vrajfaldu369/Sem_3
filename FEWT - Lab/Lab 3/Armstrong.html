<!-- WAP in JavaScript to check whether the given number is Armstrong or not. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Armstrong</title>
</head>
<body>
    <script>
        let a = parseFloat(prompt("Enter Number: "));
        let count = 0, sum = 0;
        temp1 = a, temp2 = a;
        while(temp1 > 0){
            count++;
            temp1 = parseInt(temp1 / 10);
        }
        while(temp2 > 0){
            let dig = temp2 % 10;
            sum = sum + Math.pow(dig,count);
            temp2 = parseInt(temp2 / 10);
        }
        if(sum == a){
            alert("Enterd number is an Armstrong number")
        }
        else{
            alert("Enterd number is not an Armstrong number")
        }
    </script>
</body>
</html>
