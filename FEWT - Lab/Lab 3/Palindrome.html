<!--  WAP in JavaScript to check whether the given number is palindrome or not. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palindrome</title>
</head>
<body>
    <script>
        let n = parseInt(prompt("Enter number: "));
        let org = n;
        let rem = 0, rev = 0;

        while(n != 0){
            rem = n % 10;
            rev = rev * 10 + rem;
            n = Math.floor(n / 10);
        }

        if(rev == org){
            alert("number is palindrome");
        }
        else{
            alert("number is not palindrome");
        }
    </script>
</body>
</html>
