<!-- WAP in JavaScript to check whether the given no. is prime or not. -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime</title>
</head>

<body>
    <script>
        let n = parseInt(prompt("Enter number: "));
        let check = 0;

        if (n <= 1) {
            check = 1;
        }
        else {
            for (let i = 2; i <= Math.sqrt(n); i++) {
                if (n % i == 0) {
                    check = 1;
                    break;
                }
            }
        }

        if (check == 0) {
            alert(n + " is prime number");
        }
        else {
            alert(n + " is not prime number");
        }
    </script>
</body>

</html>
